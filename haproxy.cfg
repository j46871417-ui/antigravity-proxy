global
    log stdout format raw local0 info
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon
    maxconn 4096

defaults
    log global
    mode tcp
    option dontlognull
    timeout connect 5s
    timeout client 10m
    timeout server 10m

# === DUAL-MODE (HYBRID) ANTIGRAVITY PROXY FRONTEND ===
# Automatically detects incoming protocol:
# 1. Plain HTTP CONNECT (confeden/Antigravity) -> forwards directly to python core (127.0.0.1:50127)
# 2. HTTPS Proxy (TLS ClientHello) -> terminates SSL on 127.0.0.1:50130 and forwards to python core (127.0.0.1:50127)
# Anti-DoS: Max 30 concurrent TCP connections per client IP

frontend ag_proxy_in
    bind 0.0.0.0:50128
    mode tcp
    option tcplog
    stick-table type ip size 100k expire 10m store conn_cur
    tcp-request connection reject if { src_conn_cur ge 30 }
    tcp-request connection track-sc0 src
    tcp-request inspect-delay 2s
    tcp-request content accept if { req_ssl_hello_type 1 }

    use_backend ag_ssl_backend if { req_ssl_hello_type 1 }
    default_backend ag_plain_backend

backend ag_ssl_backend
    mode tcp
    server local_ssl 127.0.0.1:50130

frontend ag_ssl_terminator
    bind 127.0.0.1:50130 ssl crt /etc/antigravity-proxy/proxy_bundle.pem
    mode tcp
    default_backend ag_plain_backend

backend ag_plain_backend
    mode tcp
    server python_proxy 127.0.0.1:50127
