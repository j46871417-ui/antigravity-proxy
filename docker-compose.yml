version: "3.8"

services:
  antigravity-proxy:
    build: .
    container_name: antigravity-proxy
    restart: unless-stopped
    ports:
      - "50128:50128"
    environment:
      - PROXY_USER=${PROXY_USER:?Set PROXY_USER in .env}
      - PROXY_PASS=${PROXY_PASS:?Set PROXY_PASS in .env}
      - LOG_LEVEL=INFO
