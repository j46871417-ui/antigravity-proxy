services:
  antigravity-proxy:
    build: .
    container_name: antigravity-proxy
    restart: unless-stopped
    ports:
      - "50128:50128"
    environment:
      PROXY_HOST: 0.0.0.0
      PROXY_PORT: 50128
      PROXY_USER: ${PROXY_USER:-antigravity}
      PROXY_PASS: ${PROXY_PASS:-change-this-password}
      USERS_FILE: /data/users.json
      USER_TRAFFIC_FILE: /data/user_traffic.json
      STATS_DB: /data/stats.db
      STATS_LOCATION: ${STATS_LOCATION:-it}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/data
